name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (arm64)
            target: aarch64-apple-darwin
          - platform: macos-latest # Intel (x86_64) — cross-compiled on the arm64 runner;
            target: x86_64-apple-darwin # GitHub retired free-tier Intel-hosted macOS runners
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract changelog section for this version
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ ("\\[" ver "\\]")) { found=1; next }
              next
            }
            found {
              if ($0 ~ /^[[:space:]]*$/) {
                if (started) pending = pending "\n"
                next
              }
              if (started) printf "%s", pending
              printf "%s\n", $0
              pending = ""
              started = 1
            }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo ""
            echo "**Full changelog:** [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # No APPLE_* signing secrets are configured yet, so this produces an unsigned,
      # ad-hoc-signed build (Gatekeeper will warn on first launch). Once a paid Apple
      # Developer "Developer ID Application" certificate is available, add
      # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
      # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID as repo secrets and re-add them here
      # under `env:` — tauri-action picks them up automatically and notarizes the build.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Serenay Mobile Deploy ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: "--target ${{ matrix.target }}"
